name: Feature request
description: An idea for @browsersweet/mcp, such as a new tool, browser or MCP client
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: The task you're trying to get done with your agent and Browser Sweet, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. A tool, a flag, a browser to support, anything.
