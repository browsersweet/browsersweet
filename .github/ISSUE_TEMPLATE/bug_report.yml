name: Bug report
description: Something in @browsersweet/mcp doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, please [report it privately](https://github.com/browsersweet/browsersweet/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include error messages as text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx @browsersweet/mcp install --extension-id …
        2. claude mcp add browsersweet -- npx -y @browsersweet/mcp
        3. Ask the agent to list my tabs
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npx @browsersweet/mcp --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, browser and MCP client
      placeholder: macOS 26.1, Chrome 142, Claude Code 2.1
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `npx @browsersweet/mcp doctor`. Check it for paths or names you'd rather not share first.
      render: text
