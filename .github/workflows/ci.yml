name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx format:check --all

      # Rejects local package references (yalc, file:, link:) under the `ci` profile in megamono.json.
      - run: pnpm exec nx run megamono:check --output-style=static

      - run: pnpm exec nx run-many -t lint typecheck test build --output-style=static

  # The published @browsersweet/mcp on every Node it supports (`engines`: >=22): built and packed with the
  # workspace's Node, then installed into an empty project and started as an MCP server on each version.
  package:
    name: Packed @browsersweet/mcp on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx run browsersweet-mcp:build --output-style=static

      - name: Pack
        working-directory: packages/mcp
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install the tarball and start the MCP server
        run: node packages/mcp/scripts/smoke-tarball.mjs "$RUNNER_TEMP"/pack/*.tgz
