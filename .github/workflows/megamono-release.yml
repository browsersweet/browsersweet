name: Release packages

# Ejected from Megamono's managed template (release.workflow in .megamono/artifacts.json), which wrote no
# npm credentials, set no git identity for the version commit and could only bump before publishing.
#
# Every package under packages/ (nx.json `release.projects`) is released together on one version
# (`projectsRelationship: fixed`): one v<version> tag, one GitHub release, every public package published.
# Private packages are versioned with the rest but never published. A new package needs no change here.
#
# Run it from Actions → "Release packages" → Run workflow. Leave "dry_run" on for a rehearsal.
#   - publish-current: publish the version already in the packages' package.json files and tag it
#     v<version>. Use it for the first release (0.1.0) and to retry a bump whose publish failed.
#   - bump-and-publish: `nx release version` (every package), push the commit and tag, then publish.
# Before a real release, add a "## <version>" entry to the CHANGELOG.md of each package that changed: the
# run stops if none has one, and the entries (under each package's name; "No changes" for the rest)
# become the notes of the v<version> GitHub release. Real releases run from the default branch only; dry
# runs work from any branch. Helpers: .github/scripts/release-packages.mjs.
#
# npm auth, whichever is available:
#   - Trusted publishing (preferred): on npmjs.com, for each package → Settings → Trusted publishing →
#     GitHub Actions, repository browsersweet/browsersweet, workflow megamono-release.yml, environment
#     npm. npm only offers this once a package exists, so a package's first publish needs a token.
#   - NPM_TOKEN: a granular npm token with publish rights to the @browsersweet scope, stored as a secret
#     on the npm environment (or the repository). Delete it once trusted publishing works for every package.
# Provenance is added automatically when the repository is public; it's skipped while it's private.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: publish-current, or bump-and-publish
        required: true
        default: publish-current
        type: choice
        options:
          - publish-current
          - bump-and-publish
      specifier:
        description: 'bump-and-publish only: semver keyword (patch, minor, prerelease…) or exact version'
        required: true
        default: patch
        type: string
      preid:
        description: 'bump-and-publish only: prerelease identifier, used with pre* keywords'
        required: true
        default: next
        type: string
      dist_tag:
        description: npm dist-tag (latest; next for a prerelease)
        required: true
        default: latest
        type: string
      dry_run:
        description: Rehearse without pushing or publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  MODE: ${{ inputs.mode }}
  SPECIFIER: ${{ inputs.specifier }}
  PREID: ${{ inputs.preid }}
  DIST_TAG: ${{ inputs.dist_tag }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      # A real release pushes its version commit and tag to the branch it ran from and publishes that
      # branch's code, so only the default branch may do one. Dry runs work from any branch.
      - name: Release only from the default branch
        if: ${{ !inputs.dry_run && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Releases run from ${DEFAULT_BRANCH} only, not ${REF}. Turn dry_run on to rehearse from another branch."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx run-many -t lint typecheck test build --projects='packages/*' --output-style=static

      - name: Set the git identity for the release commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Version
        id: version
        run: |
          if [ "$MODE" = bump-and-publish ]; then
            flags=(--git-commit --git-tag)
            if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
            pnpm exec nx release version "$SPECIFIER" --preid "$PREID" "${flags[@]}"
          fi
          version="$(node .github/scripts/release-packages.mjs version)"
          if [ "$MODE" = bump-and-publish ] && [ "$DRY_RUN" = true ]; then
            echo "Dry run: the bump above wasn't written, so this run rehearses publishing $version."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # A real run stops here, before pushing or publishing anything, when no package changelog has an
      # entry for this version.
      - name: Collect the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          node .github/scripts/release-packages.mjs notes "$VERSION" "$RUNNER_TEMP/release-notes.md" || status=$?
          if [ "$status" = 2 ]; then
            message="No package CHANGELOG.md has a \"## ${VERSION}\" entry. Add one for each package that changed, then run the release again."
            if [ "$DRY_RUN" = true ]; then echo "::warning::$message"; else echo "::error::$message"; exit 1; fi
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi

      # Pushed before publishing: if the publish then fails, rerun with publish-current.
      - name: Push the version commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$MODE" = bump-and-publish ]; then
            git push --follow-tags origin HEAD
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already on origin."
          else
            git tag --annotate "$TAG" --message "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Use NPM_TOKEN when it's set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo 'Publishing with NPM_TOKEN.'
          else
            echo 'No NPM_TOKEN: publishing through npm trusted publishing.'
          fi

      # Publishes every release package; ones already on npm at this version are skipped, so a rerun only
      # publishes what's missing.
      - name: Publish
        run: |
          flags=(--tag "$DIST_TAG")
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
          pnpm exec nx release publish "${flags[@]}"

      # After publishing, so a release page never points at a version npm doesn't have. A rerun with
      # publish-current leaves an existing release alone.
      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The $TAG release already exists."
            exit 0
          fi
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
